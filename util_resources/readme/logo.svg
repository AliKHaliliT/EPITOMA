<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140" role="img" aria-label="EPITOMA">
  <!-- The brand plaque: EPITOMA's pixel-mark (the family mosaic with a
       dog-eared page corner, a document distilled from the record) beside
       the wordmark. Self-contained on the dossier's charcoal card so it
       reads correctly on both GitHub themes. Colors follow the Rangefinder
       seed. -->
  <rect width="400" height="140" rx="10" fill="#1b1815"/>
  <rect x="36" y="40" width="26" height="26" fill="#efeae3"/>
  <rect x="70" y="40" width="26" height="26" fill="#ff7038"/>
  <polygon points="104,40 130,66 104,66" fill="#efeae3"/>
  <rect x="36" y="74" width="26" height="26" fill="#efeae3"/>
  <rect x="70" y="74" width="26" height="26" fill="#efeae3"/>
  <rect x="104" y="74" width="26" height="26" fill="#8fc3d8"/>
  <text x="158" y="70" dominant-baseline="central" fill="#efeae3"
        font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Consolas, monospace"
        font-size="42" font-weight="700" letter-spacing="2">EPITOMA</text>
</svg>
